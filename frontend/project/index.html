<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      connect-src 'self' https://*.auth0.com https://*.us.auth0.com https://clarity-backend-production.up.railway.app wss://clarity-backend-production.up.railway.app;
      font-src 'self' data: https://*.auth0.com https://rsms.me;
      style-src 'self' 'unsafe-inline' https://*.auth0.com;
      script-src 'self' 'unsafe-inline' https://*.auth0.com https://cdn.auth0.com https://cdn.jsdelivr.net 'wasm-unsafe-eval';
      worker-src 'self' blob: https://cdn.jsdelivr.net;
      img-src 'self' data: https://*.auth0.com https://s.gravatar.com blob:;
      frame-src 'self' https://*.auth0.com https://*.us.auth0.com;
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
      block-all-mixed-content;
    " />
    <link rel="icon" type="image/svg+xml" href="/HD Clarity.png" />
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="description" content="Transform any document into clear, easy-to-understand explanations with Clarity's AI-powered study companion. Get instant answers, study guides, and interactive learning support." />

    <!-- Primary Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <title>Clarity - AI-Powered Study Companion</title>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('https://rsms.me/inter/font-files/Inter-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* Performance optimizations for smoother animations */
      .transform-gpu {
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
      }
      .backface-visibility-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      /* Prevent layout thrashing during sidebar transitions */
      * {
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
      }
      /* iOS-specific optimizations */
      input, textarea, button, select {
        -webkit-appearance: none;
        border-radius: 0;
      }
      /* Prevent text size adjustment on orientation change */
      html {
        -webkit-text-size-adjust: 100%;
      }
    </style>
    <!-- Performance optimization script -->
    <script src="/performance-optimization.js" defer></script>
